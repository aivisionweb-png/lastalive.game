<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>LAST//ALIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020605;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      touch-action: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(25, 110, 90, .16),
          transparent 45%
        ),
        #020605;
    }

    .start-card {
      width: min(520px, 90vw);
      padding: 42px;
      border: 1px solid rgba(90, 230, 190, .18);
      background: rgba(3, 10, 9, .94);
      box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 0 80px rgba(40,220,170,.025);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 5px;
      font-weight: 800;
      color: #59e5bd;
      margin-bottom: 22px;
    }

    .logo {
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 1000;
      letter-spacing: -5px;
      line-height: .9;
      white-space: nowrap;
    }

    .logo span {
      color: #59e5bd;
    }

    .description {
      margin-top: 28px;
      color: #71847f;
      line-height: 1.7;
      font-size: 14px;
      max-width: 430px;
    }

    #playerName {
      width: 100%;
      height: 58px;
      margin-top: 30px;
      border: 1px solid #1b3932;
      outline: none;
      background: #07100e;
      color: white;
      padding: 0 18px;
      font-size: 16px;
    }

    #playerName:focus {
      border-color: #59e5bd;
    }

    #dropButton {
      width: 100%;
      height: 60px;
      margin-top: 12px;
      border: 0;
      background: #59e5bd;
      color: #00100c;
      font-size: 15px;
      font-weight: 1000;
      letter-spacing: 1px;
      cursor: pointer;
    }

    #dropButton:hover {
      background: #75f0ca;
    }

    #dropButton:active {
      transform: translateY(1px);
    }

    #status {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      color: #668078;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .controls {
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
      color: #52655f;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #hud {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      position: absolute;
      min-width: 100px;
      padding: 13px 17px;
      background: rgba(3, 9, 8, .78);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }

    .hud-label {
      color: #688079;
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 22px;
      font-weight: 900;
    }

    #aliveBox {
      left: 20px;
      top: 20px;
    }

    #zoneBox {
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
    }

    #killBox {
      right: 150px;
      top: 20px;
    }

    #weaponBox {
      right: 20px;
      top: 20px;
    }

    #bottomHUD {
      left: 20px;
      bottom: 20px;
      position: absolute;
      display: flex;
      gap: 8px;
    }

    .barBox {
      min-width: 100px;
      padding: 12px 15px;
      background: rgba(3, 9, 8, .8);
      border: 1px solid rgba(255,255,255,.08);
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.9);
    }

    #crosshair::before {
      width: 2px;
      height: 22px;
      left: 10px;
    }

    #crosshair::after {
      height: 2px;
      width: 22px;
      top: 10px;
    }

    #mobileControls {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .mobile-btn {
      pointer-events: auto;
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(5,15,13,.72);
      color: white;
      font-weight: 900;
      backdrop-filter: blur(8px);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #mUp {
      left: 78px;
      bottom: 135px;
    }

    #mLeft {
      left: 10px;
      bottom: 68px;
    }

    #mDown {
      left: 78px;
      bottom: 68px;
    }

    #mRight {
      left: 146px;
      bottom: 68px;
    }

    #mShoot {
      right: 24px;
      bottom: 100px;
      width: 76px;
      height: 76px;
      background: rgba(190,55,55,.65);
    }

    #mSprint {
      right: 115px;
      bottom: 35px;
    }

    #mJump {
      right: 25px;
      bottom: 25px;
    }

    #result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
    }

    .result-card {
      text-align: center;
      padding: 45px;
      background: #050b09;
      border: 1px solid #21483e;
      width: min(430px, 90vw);
    }

    #resultTitle {
      font-size: 48px;
      font-weight: 1000;
    }

    #resultText {
      color: #71847f;
      margin: 15px 0 25px;
    }

    #again {
      width: 100%;
      height: 52px;
      border: 0;
      background: #59e5bd;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .start-card {
        padding: 28px 22px;
      }

      .logo {
        font-size: 48px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      #mobileControls {
        display: block;
      }

      #killBox {
        display: none;
      }

      #bottomHUD {
        bottom: 15px;
        left: 15px;
      }

      .barBox {
        min-width: 75px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <div class="start-card">

      <div class="eyebrow">DISTRICT 09 // BATTLE ROYALE</div>

      <div class="logo">
        LAST<span>//</span>ALIVE
      </div>

      <div class="description">
        Drop into the combat zone.
        Move fast. Aim clean. Survive.
      </div>

      <input
        id="playerName"
        type="text"
        maxlength="14"
        autocomplete="off"
        placeholder="ENTER PLAYER NAME"
      >

      <button id="dropButton" type="button">
        DROP INTO DISTRICT →
      </button>

      <div id="status"></div>

      <div class="controls">
        <div>WASD / ARROWS — MOVE</div>
        <div>SHIFT — SPRINT</div>
        <div>MOUSE — AIM</div>
        <div>LEFT CLICK — FIRE</div>
        <div>SPACE — JUMP</div>
        <div>R — RELOAD</div>
      </div>

    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">

    <div id="aliveBox" class="hud-box">
      <div class="hud-label">ALIVE</div>
      <div id="alive" class="hud-value">12</div>
    </div>

    <div id="zoneBox" class="hud-box">
      <div class="hud-label">ZONE</div>
      <div id="zone" class="hud-value">500m</div>
    </div>

    <div id="killBox" class="hud-box">
      <div class="hud-label">KILLS</div>
      <div id="kills" class="hud-value">0</div>
    </div>

    <div id="weaponBox" class="hud-box">
      <div class="hud-label">WEAPON</div>
      <div id="weapon" class="hud-value">AR-01</div>
    </div>

    <div id="bottomHUD">

      <div class="barBox">
        <div class="hud-label">HP</div>
        <div id="health" class="hud-value">100</div>
      </div>

      <div class="barBox">
        <div class="hud-label">ARMOR</div>
        <div id="armor" class="hud-value">100</div>
      </div>

      <div class="barBox">
        <div class="hud-label">AMMO</div>
        <div id="ammo" class="hud-value">30 / 150</div>
      </div>

      <div class="barBox">
        <div class="hud-label">MED</div>
        <div id="medkits" class="hud-value">2</div>
      </div>

    </div>

    <div id="crosshair"></div>
  </div>

  <div id="mobileControls">

    <button class="mobile-btn" id="mUp">▲</button>
    <button class="mobile-btn" id="mLeft">◀</button>
    <button class="mobile-btn" id="mDown">▼</button>
    <button class="mobile-btn" id="mRight">▶</button>

    <button class="mobile-btn" id="mShoot">FIRE</button>
    <button class="mobile-btn" id="mSprint">RUN</button>
    <button class="mobile-btn" id="mJump">JUMP</button>

  </div>

  <div id="result">
    <div class="result-card">
      <div id="resultTitle">ELIMINATED</div>
      <div id="resultText"></div>
      <button id="again">PLAY AGAIN</button>
    </div>
  </div>


  <!-- THREE.JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js">
  </script>

  <!-- FALLBACK -->
  <script>
    window.THREE_READY = false;

    function loadGameScript() {
      const s = document.createElement("script");
      s.src = "./script.js?v=100";
      s.onload = function () {
        window.THREE_READY = true;
        console.log("LAST//ALIVE JS loaded");
      };
      s.onerror = function () {
        const status = document.getElementById("status");
        if (status) {
          status.textContent = "GAME SCRIPT FAILED TO LOAD";
        }
      };
      document.body.appendChild(s);
    }

    window.addEventListener("load", loadGameScript);
  </script>

</body>
</html>
