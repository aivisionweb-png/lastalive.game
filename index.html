<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LAST//ALIVE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="logo">LAST<span>//</span>ALIVE</div>

  <div class="stats">
    <div class="health">
      <small>HEALTH</small>
      <div class="bar"><i id="healthBar"></i></div>
      <b id="healthText">100</b>
    </div>

    <div class="weapon">
      <small>WEAPON</small>
      <strong>ASSAULT RIFLE</strong>
      <div>
        <b id="ammo">30</b>
        <span>/ 120</span>
      </div>
    </div>
  </div>

  <div id="crosshair">+</div>

  <div class="controls">
    WASD MOVE &nbsp; • &nbsp;
    SHIFT SPRINT &nbsp; • &nbsp;
    SPACE JUMP &nbsp; • &nbsp;
    C CROUCH &nbsp; • &nbsp;
    MOUSE AIM &nbsp; • &nbsp;
    CLICK SHOOT
  </div>
</div>

<div id="start">
  <div class="startBox">
    <div class="mini">OPEN WORLD / SURVIVAL</div>
    <h1>LAST<span>//</span>ALIVE</h1>
    <p>ENTER THE CITY</p>
    <button id="play">PLAY GAME</button>
  </div>
</div>

<div id="dead">
  <div>
    <div class="mini">YOU DIED</div>
    <h2>MISSION<br><span>FAILED.</span></h2>
    <button onclick="location.reload()">RESPAWN</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module" src="./script.js"></script>

</body>
</html>
