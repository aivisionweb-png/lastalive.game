<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAST//ALIVE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05090a;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#start{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,#0d2523 0%,#05090a 48%,#020405 100%);
}

.card{
  width:min(500px,90vw);
  padding:42px;
  border:1px solid #1d3c39;
  background:rgba(3,9,9,.92);
  box-shadow:0 30px 100px #000;
}

.kicker{
  color:#53e4c0;
  font-size:12px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:18px;
}

.logo{
  font-size:clamp(42px,9vw,78px);
  line-height:.9;
  font-weight:950;
  letter-spacing:-5px;
}

.logo span{
  color:#55e7c2;
}

.desc{
  margin-top:25px;
  color:#78918e;
  line-height:1.7;
  font-size:14px;
}

#name{
  width:100%;
  height:58px;
  margin-top:28px;
  padding:0 18px;
  background:#07100f;
  border:1px solid #1b3835;
  outline:none;
  color:#fff;
  font-size:16px;
}

#name:focus{
  border-color:#55e7c2;
}

#enter{
  width:100%;
  height:58px;
  margin-top:12px;
  border:0;
  background:#55e7c2;
  color:#03100d;
  font-size:15px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
}

#enter:active{
  transform:scale(.98);
}

.controls{
  margin-top:24px;
  color:#55716d;
  font-size:11px;
  line-height:2;
  letter-spacing:1px;
}

#hud{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.top{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stat{
  min-width:100px;
  padding:12px 16px;
  background:rgba(3,9,10,.78);
  border:1px solid rgba(120,220,200,.16);
  backdrop-filter:blur(8px);
}

.stat small{
  display:block;
  color:#607975;
  font-size:9px;
  letter-spacing:2px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:20px;
}

.bottom{
  position:absolute;
  left:18px;
  bottom:18px;
  display:flex;
  gap:10px;
}

.bar{
  padding:12px 16px;
  background:rgba(3,9,10,.82);
  border:1px solid rgba(120,220,200,.16);
}

.bar small{
  display:block;
  color:#607975;
  font-size:9px;
  letter-spacing:2px;
}

.bar b{
  font-size:19px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  opacity:.8;
}

#crosshair:before{
  width:2px;
  height:22px;
  left:10px;
}

#crosshair:after{
  height:2px;
  width:22px;
  top:10px;
}

#damage{
  position:absolute;
  inset:0;
  background:#e33b3b;
  opacity:0;
  transition:opacity .1s;
}

#mobile{
  display:none;
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
}

.joy{
  position:absolute;
  left:25px;
  bottom:28px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  pointer-events:auto;
}

.stick{
  position:absolute;
  width:56px;
  height:56px;
  left:37px;
  top:37px;
  border-radius:50%;
  background:rgba(83,228,192,.38);
  border:1px solid #55e7c2;
}

.mbuttons{
  position:absolute;
  right:22px;
  bottom:25px;
  display:grid;
  grid-template-columns:70px 70px;
  gap:12px;
  pointer-events:auto;
}

.mbtn{
  width:70px;
  height:70px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,12,13,.75);
  color:white;
  font-weight:900;
  font-size:12px;
}

.mbtn.fire{
  width:84px;
  height:84px;
  grid-column:2;
  background:rgba(220,55,55,.72);
  border-color:#ff7777;
}

.mbtn.sprint{
  background:rgba(83,228,192,.25);
  border-color:#55e7c2;
}

#result{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
}

.resultBox{
  width:min(430px,90vw);
  text-align:center;
  padding:45px;
  background:#050a0a;
  border:1px solid #21433e;
}

#resultTitle{
  font-size:52px;
  font-weight:950;
}

#resultText{
  margin:15px 0 25px;
  color:#7d9692;
}

#again{
  width:100%;
  height:55px;
  border:0;
  background:#55e7c2;
  font-weight:900;
}

@media(max-width:700px){
  .card{
    padding:28px;
  }

  .top{
    top:10px;
    left:10px;
    right:10px;
  }

  .stat{
    min-width:70px;
    padding:8px 10px;
  }

  .stat b{
    font-size:16px;
  }

  .bottom{
    display:none;
  }

  #crosshair{
    display:none;
  }

  #mobile{
    display:block;
  }
}
</style>
</head>

<body>

<div id="start">
  <div class="card">
    <div class="kicker">DISTRICT 10 // URBAN COMBAT</div>

    <div class="logo">
      LAST<span>//</span>ALIVE
    </div>

    <div class="desc">
      Drop into the combat district.<br>
      Move fast. Find weapons. Eliminate everyone.
    </div>

    <input
      id="name"
      maxlength="14"
      autocomplete="off"
      placeholder="ENTER PLAYER NAME"
    >

    <button id="enter">
      DROP INTO DISTRICT →
    </button>

    <div class="controls">
      WASD / ARROWS — MOVE<br>
      SHIFT — SPRINT<br>
      MOUSE — AIM<br>
      LEFT CLICK — FIRE<br>
      SPACE — DASH / JUMP
    </div>
  </div>
</div>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top">

    <div class="stat">
      <small>ALIVE</small>
      <b id="alive">10</b>
    </div>

    <div class="stat">
      <small>ZONE</small>
      <b id="zone">900</b>
    </div>

    <div class="stat">
      <small>KILLS</small>
      <b id="kills">0</b>
    </div>

    <div class="stat">
      <small>WEAPON</small>
      <b>AR-01</b>
    </div>

  </div>

  <div id="crosshair"></div>
  <div id="damage"></div>

  <div class="bottom">

    <div class="bar">
      <small>HP</small>
      <b id="hp">100</b>
    </div>

    <div class="bar">
      <small>ARMOR</small>
      <b id="armor">100</b>
    </div>

    <div class="bar">
      <small>AMMO</small>
      <b id="ammo">30 / 150</b>
    </div>

  </div>

</div>

<div id="mobile">

  <div id="joy" class="joy">
    <div id="stick" class="stick"></div>
  </div>

  <div class="mbuttons">
    <button id="jump" class="mbtn">JUMP</button>
    <button id="sprint" class="mbtn sprint">RUN</button>
    <button id="fire" class="mbtn fire">FIRE</button>
  </div>

</div>

<div id="result">
  <div class="resultBox">
    <div id="resultTitle">ELIMINATED</div>
    <div id="resultText"></div>
    <button id="again">PLAY AGAIN</button>
  </div>
</div>

<script src="./script.js"></script>

</body>
</html>
