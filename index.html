<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>LAST//ALIVE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07100e;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:relative;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= START ================= */

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 45%,#12372f 0%,#07100e 45%,#020504 100%);
}

.startCard{
  width:min(520px,90vw);
  padding:42px;
  border:1px solid rgba(90,230,190,.25);
  background:rgba(4,12,10,.88);
  box-shadow:
    0 0 80px rgba(50,220,170,.08),
    inset 0 0 40px rgba(50,220,170,.025);
}

.kicker{
  color:#55e2bf;
  font-size:12px;
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:14px;
}

.logo{
  color:#fff;
  font-size:clamp(44px,9vw,82px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:-5px;
}

.logo span{
  color:#51e4bd;
}

.desc{
  margin-top:24px;
  color:#91aaa4;
  font-size:14px;
  line-height:1.7;
}

#name{
  width:100%;
  margin-top:28px;
  height:56px;
  padding:0 18px;
  color:#fff;
  background:#081512;
  border:1px solid #25483f;
  outline:none;
  font-size:16px;
}

#name:focus{
  border-color:#51e4bd;
}

#enter{
  width:100%;
  height:58px;
  margin-top:12px;
  border:0;
  background:#51e4bd;
  color:#03100d;
  font-weight:1000;
  font-size:15px;
  letter-spacing:1px;
  cursor:pointer;
}

#enter:active{
  transform:scale(.98);
}

.controls{
  margin-top:24px;
  color:#58736c;
  font-size:11px;
  line-height:2;
  letter-spacing:1px;
}

/* ================= HUD ================= */

#hud{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
}

.topHud{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stat{
  min-width:95px;
  padding:10px 13px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
}

.stat small{
  display:block;
  color:#82938f;
  font-size:9px;
  letter-spacing:2px;
}

.stat strong{
  display:block;
  margin-top:3px;
  font-size:20px;
}

.bottomHud{
  position:absolute;
  left:18px;
  bottom:18px;
  display:flex;
  gap:8px;
}

.box{
  padding:11px 15px;
  min-width:90px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.1);
}

.box small{
  display:block;
  color:#81908d;
  font-size:9px;
  letter-spacing:2px;
}

.box strong{
  display:block;
  margin-top:4px;
  font-size:20px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:24px;
  height:24px;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  opacity:.9;
}

#crosshair:before{
  width:2px;
  height:24px;
  left:11px;
}

#crosshair:after{
  height:2px;
  width:24px;
  top:11px;
}

#message{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  color:#fff;
  font-size:13px;
  letter-spacing:3px;
  font-weight:bold;
  text-align:center;
}

/* ================= MOBILE ================= */

#mobile{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:24px;
  bottom:30px;
  width:130px;
  height:130px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.2);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:34px;
  top:34px;
  border-radius:50%;
  background:rgba(80,225,190,.55);
  border:2px solid rgba(255,255,255,.3);
}

.mobileBtn{
  position:absolute;
  width:68px;
  height:68px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.48);
  color:#fff;
  font-weight:900;
  pointer-events:auto;
}

#fire{
  right:28px;
  bottom:38px;
  width:88px;
  height:88px;
  background:rgba(210,55,55,.48);
}

#sprint{
  right:126px;
  bottom:44px;
}

#jump{
  right:38px;
  bottom:145px;
}

#reload{
  right:125px;
  bottom:140px;
}

#switch{
  right:30px;
  top:110px;
}

#mobileAim{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

/* ================= RESULT ================= */

#result{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.resultCard{
  width:min(480px,90vw);
  padding:45px;
  text-align:center;
  background:#07110f;
  border:1px solid #31564c;
}

#resultTitle{
  color:#fff;
  font-size:48px;
  margin:0;
}

#resultText{
  color:#8fa9a2;
  margin:14px 0 25px;
}

#again{
  width:100%;
  height:52px;
  border:0;
  background:#51e4bd;
  font-weight:900;
  cursor:pointer;
}

/* PHONE */

@media(max-width:800px){
  .startCard{
    padding:28px;
  }

  .logo{
    font-size:52px;
  }

  .topHud{
    top:8px;
    left:8px;
    right:8px;
  }

  .stat{
    min-width:65px;
    padding:7px;
  }

  .stat strong{
    font-size:15px;
  }

  .bottomHud{
    left:8px;
    bottom:8px;
  }

  .box{
    min-width:70px;
    padding:7px;
  }

  .box strong{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="start">
  <div class="startCard">

    <div class="kicker">
      DISTRICT 10 // SURVIVAL
    </div>

    <div class="logo">
      LAST<span>//</span>ALIVE
    </div>

    <div class="desc">
      DROP INTO THE DISTRICT.<br>
      MOVE FAST. AIM CLEAN. SURVIVE.
    </div>

    <input
      id="name"
      maxlength="14"
      placeholder="ENTER PLAYER NAME"
      autocomplete="off"
    >

    <button id="enter">
      DROP INTO DISTRICT →
    </button>

    <div class="controls">
      WASD / ARROWS — MOVE<br>
      SHIFT — SPRINT<br>
      MOUSE — AIM<br>
      LEFT CLICK — FIRE<br>
      SPACE — JUMP<br>
      R — RELOAD
    </div>

  </div>
</div>

<div id="hud">

  <div class="topHud">

    <div class="stat">
      <small>ALIVE</small>
      <strong id="alive">12</strong>
    </div>

    <div class="stat">
      <small>ZONE</small>
      <strong id="zone">100%</strong>
    </div>

    <div class="stat">
      <small>KILLS</small>
      <strong id="kills">0</strong>
    </div>

    <div class="stat">
      <small>WEAPON</small>
      <strong id="weapon">AR</strong>
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="message"></div>

  <div class="bottomHud">

    <div class="box">
      <small>HP</small>
      <strong id="health">100</strong>
    </div>

    <div class="box">
      <small>ARMOR</small>
      <strong id="armor">100</strong>
    </div>

    <div class="box">
      <small>AMMO</small>
      <strong id="ammo">30 / 150</strong>
    </div>

    <div class="box">
      <small>MED</small>
      <strong id="medkits">2</strong>
    </div>

  </div>

</div>

<div id="mobile">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="mobileAim"></div>

  <button class="mobileBtn" id="fire">
    FIRE
  </button>

  <button class="mobileBtn" id="sprint">
    RUN
  </button>

  <button class="mobileBtn" id="jump">
    JUMP
  </button>

  <button class="mobileBtn" id="reload">
    R
  </button>

  <button class="mobileBtn" id="switch">
    GUN
  </button>

</div>

<div id="result">

  <div class="resultCard">

    <h1 id="resultTitle">
      ELIMINATED
    </h1>

    <div id="resultText">
      0 KILLS
    </div>

    <button id="again">
      PLAY AGAIN
    </button>

  </div>

</div>

<script src="./script.js"></script>

</body>
</html>
