<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAST//ALIVE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020706;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:white;
}

#start{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,#08322b 0%,#03100e 38%,#020403 78%);
}

.card{
    width:min(520px,90vw);
    padding:42px;
    border:1px solid #1d5148;
    background:rgba(2,10,9,.92);
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.kicker{
    color:#54e4c4;
    font-size:12px;
    letter-spacing:5px;
    font-weight:bold;
    margin-bottom:14px;
}

.logo{
    font-size:clamp(44px,9vw,78px);
    font-weight:900;
    letter-spacing:-5px;
    line-height:.9;
}

.logo span{
    color:#42e0bd;
}

.desc{
    margin-top:25px;
    color:#829892;
    line-height:1.7;
    font-size:14px;
}

#name{
    width:100%;
    margin-top:28px;
    height:58px;
    padding:0 18px;
    background:#06100e;
    border:1px solid #254a43;
    color:white;
    outline:none;
    font-size:16px;
}

#name:focus{
    border-color:#4ee3c2;
}

#enter{
    width:100%;
    height:58px;
    margin-top:12px;
    border:0;
    background:#50dfbf;
    color:#00110c;
    font-weight:900;
    font-size:15px;
    letter-spacing:1px;
    cursor:pointer;
    touch-action:manipulation;
}

#enter:active{
    transform:scale(.98);
}

.controls{
    margin-top:25px;
    color:#60756f;
    font-size:11px;
    line-height:2;
    letter-spacing:1px;
}

#loading{
    display:none;
    margin-top:15px;
    text-align:center;
    color:#50dfbf;
    font-size:11px;
    letter-spacing:2px;
}

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.hudbox{
    position:absolute;
    top:18px;
    background:rgba(3,9,8,.78);
    border:1px solid rgba(90,220,190,.25);
    padding:10px 14px;
    min-width:90px;
}

.hudbox small{
    display:block;
    color:#78918a;
    font-size:9px;
    letter-spacing:2px;
}

.hudbox strong{
    display:block;
    margin-top:4px;
    font-size:20px;
}

#aliveBox{left:18px}
#zoneBox{left:130px}
#killsBox{right:130px}
#weaponBox{right:18px}

#bottomHUD{
    position:absolute;
    left:18px;
    bottom:18px;
    display:flex;
    gap:8px;
}

.stat{
    background:rgba(3,9,8,.82);
    border:1px solid rgba(90,220,190,.2);
    padding:10px 14px;
    min-width:90px;
}

.stat small{
    display:block;
    color:#78918a;
    font-size:9px;
    letter-spacing:2px;
}

.stat b{
    font-size:19px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
}

#crosshair:before{
    width:24px;
    height:2px;
    top:11px;
}

#crosshair:after{
    height:24px;
    width:2px;
    left:11px;
}

#mobile{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
}

.mobileBtn{
    position:absolute;
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(10,20,18,.6);
    color:white;
    border-radius:50%;
    width:68px;
    height:68px;
    font-weight:bold;
    backdrop-filter:blur(5px);
    user-select:none;
}

#shoot{
    right:28px;
    bottom:105px;
    width:84px;
    height:84px;
    background:rgba(220,55,55,.45);
}

#jump{
    right:125px;
    bottom:115px;
}

#sprint{
    right:125px;
    bottom:35px;
}

#aim{
    right:28px;
    bottom:205px;
}

#reload{
    right:125px;
    bottom:195px;
}

#joy{
    position:absolute;
    left:25px;
    bottom:35px;
    width:145px;
    height:145px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(10,20,18,.4);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    border-radius:50%;
    left:41px;
    top:41px;
    background:rgba(80,223,191,.45);
}

@media(max-width:800px){
    #mobile{
        display:block;
    }

    .controls{
        display:none;
    }

    #bottomHUD{
        transform:scale(.8);
        transform-origin:left bottom;
    }

    .hudbox{
        transform:scale(.8);
        transform-origin:top left;
    }

    #killsBox{
        right:90px;
    }

    #weaponBox{
        right:8px;
    }
}

canvas{
    position:fixed;
    inset:0;
    display:block;
}
</style>
</head>

<body>

<div id="start">
    <div class="card">
        <div class="kicker">DISTRICT 10 // BATTLE ROYALE</div>

        <div class="logo">
            LAST<span>//</span>ALIVE
        </div>

        <div class="desc">
            DROP INTO THE COMBAT ZONE.<br>
            MOVE FAST. AIM CLEAN. SURVIVE.
        </div>

        <input
            id="name"
            maxlength="14"
            autocomplete="off"
            placeholder="ENTER PLAYER NAME"
        >

        <button id="enter" type="button">
            DROP INTO DISTRICT →
        </button>

        <div id="loading">INITIALIZING GAME...</div>

        <div class="controls">
            WASD / ARROWS — MOVE<br>
            SHIFT — SPRINT<br>
            MOUSE — AIM<br>
            LEFT CLICK — FIRE<br>
            SPACE — JUMP<br>
            R — RELOAD<br>
            V — CAMERA
        </div>
    </div>
</div>

<div id="hud">

    <div id="aliveBox" class="hudbox">
        <small>ALIVE</small>
        <strong id="alive">12</strong>
    </div>

    <div id="zoneBox" class="hudbox">
        <small>ZONE</small>
        <strong id="zone">180m</strong>
    </div>

    <div id="killsBox" class="hudbox">
        <small>KILLS</small>
        <strong id="kills">0</strong>
    </div>

    <div id="weaponBox" class="hudbox">
        <small>WEAPON</small>
        <strong id="weapon">AR-01</strong>
    </div>

    <div id="bottomHUD">
        <div class="stat">
            <small>HP</small>
            <b id="health">100</b>
        </div>

        <div class="stat">
            <small>ARMOR</small>
            <b id="armor">100</b>
        </div>

        <div class="stat">
            <small>AMMO</small>
            <b id="ammo">30 / 150</b>
        </div>
    </div>

    <div id="crosshair"></div>
</div>

<div id="mobile">
    <div id="joy">
        <div id="stick"></div>
    </div>

    <button class="mobileBtn" id="shoot">FIRE</button>
    <button class="mobileBtn" id="aim">AIM</button>
    <button class="mobileBtn" id="jump">JUMP</button>
    <button class="mobileBtn" id="sprint">RUN</button>
    <button class="mobileBtn" id="reload">R</button>
</div>

<!-- IMPORTANT: only ONE Three.js script -->
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>

<script src="./script.js"></script>

</body>
</html>
