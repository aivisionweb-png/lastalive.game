<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAST//ALIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b0d;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(35, 70, 74, .35), transparent 40%),
        linear-gradient(135deg, #050708, #101719);
    }

    .card {
      width: min(430px, 90vw);
      padding: 42px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(8,12,14,.88);
      box-shadow: 0 30px 100px rgba(0,0,0,.65);
      backdrop-filter: blur(18px);
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
      color: white;
    }

    .logo i {
      color: #39e6c4;
      font-style: normal;
    }

    .sub {
      margin-top: 8px;
      margin-bottom: 30px;
      color: #758487;
      font-size: 11px;
      letter-spacing: 3px;
    }

    #name {
      width: 100%;
      padding: 16px;
      border: 1px solid #263638;
      outline: none;
      background: #101719;
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
    }

    #enter {
      width: 100%;
      padding: 17px;
      border: 0;
      cursor: pointer;
      background: #39e6c4;
      color: #06100f;
      font-weight: 900;
      letter-spacing: 1px;
    }

    #hud {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      color: white;
    }

    #top {
      position: absolute;
      top: 22px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
    }

    .hudBox {
      background: rgba(5,8,9,.72);
      border: 1px solid rgba(255,255,255,.1);
      padding: 12px 16px;
      backdrop-filter: blur(10px);
    }

    .label {
      color: #7c8a8d;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 900;
    }

    #bottom {
      position: absolute;
      left: 22px;
      bottom: 22px;
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 90px;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.9);
    }

    #crosshair::before {
      width: 18px;
      height: 1px;
      top: 9px;
    }

    #crosshair::after {
      width: 1px;
      height: 18px;
      left: 9px;
    }

    #controls {
      position: absolute;
      right: 22px;
      bottom: 22px;
      text-align: right;
      color: #9aa5a7;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    #result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
    }

    .resultCard {
      text-align: center;
      background: #0b1012;
      border: 1px solid #263638;
      padding: 45px;
      min-width: 340px;
    }

    #resultTitle {
      color: #39e6c4;
      font-size: 48px;
      margin: 0;
    }

    #resultText {
      color: #879396;
      margin: 12px 0 25px;
    }

    #again {
      pointer-events: auto;
      padding: 14px 28px;
      border: 0;
      background: white;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="start">
    <div class="card">
      <div class="logo">LAST<i>//</i>ALIVE</div>
      <div class="sub">DISTRICT 07 // BATTLE ROYALE</div>

      <input
        id="name"
        maxlength="14"
        autocomplete="off"
        placeholder="ENTER PLAYER NAME"
      />

      <button id="enter">
        DROP INTO DISTRICT →
      </button>
    </div>
  </div>

  <div id="hud">

    <div id="top">

      <div class="hudBox">
        <div class="label">ALIVE</div>
        <div class="value" id="alive">12</div>
      </div>

      <div class="hudBox">
        <div class="label">ZONE</div>
        <div class="value" id="zone">150m</div>
      </div>

      <div class="hudBox">
        <div class="label">KILLS</div>
        <div class="value" id="kills">0</div>
      </div>

      <div class="hudBox">
        <div class="label">WEAPON</div>
        <div class="value" id="weapon">AR-01</div>
      </div>

    </div>

    <div id="crosshair"></div>

    <div id="bottom">

      <div class="hudBox stat">
        <div class="label">HEALTH</div>
        <div class="value" id="health">100</div>
      </div>

      <div class="hudBox stat">
        <div class="label">ARMOR</div>
        <div class="value" id="armor">100</div>
      </div>

      <div class="hudBox stat">
        <div class="label">AMMO</div>
        <div class="value" id="ammo">30 / 150</div>
      </div>

      <div class="hudBox stat">
        <div class="label">MEDKIT</div>
        <div class="value" id="medkits">2</div>
      </div>

    </div>

    <div id="controls">
      WASD — MOVE<br>
      SHIFT — SPRINT<br>
      SPACE — JUMP<br>
      C — CROUCH<br>
      MOUSE — AIM<br>
      LMB — FIRE<br>
      R — RELOAD<br>
      1 / 2 / 3 — WEAPON<br>
      V — CAMERA<br>
      G — MEDKIT
    </div>

  </div>

  <div id="result">
    <div class="resultCard">
      <h1 id="resultTitle">BOOYAH!</h1>
      <p id="resultText">WINNER</p>
      <button id="again">PLAY AGAIN</button>
    </div>
  </div>

  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>

  <!-- GLTF LOADER -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/loaders/GLTFLoader.js"></script>

  <script src="./script.js"></script>

</body>
</html>
